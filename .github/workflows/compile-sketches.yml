name: Compile Arduino Sketches

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino MKR Zero core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd

      - name: Install required libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "Adafruit AHTX0"
          arduino-cli lib install "DHT20"
          arduino-cli lib install "LiquidCrystal I2C"

      - name: Compile all sketches
        shell: bash
        run: |
          set -euo pipefail
          found_any="false"

          while IFS= read -r -d '' sketch; do
            found_any="true"
            echo "Compiling: ${sketch}"
            arduino-cli compile --fqbn arduino:samd:mkrzero "${sketch}"
          done < <(find examples -type f -name "*.ino" -print0)

          if [ "${found_any}" = "false" ]; then
            echo "No .ino sketches found under examples/."
            exit 1
          fi
